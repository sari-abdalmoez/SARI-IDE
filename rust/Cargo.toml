[package]
name = "sari-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "sari_native"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
